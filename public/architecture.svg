<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1235" viewBox="0 0 1640 1235"><title>Agent SDK query sequence</title><desc>The host invokes query once, consumes the SDK iterator and forwards selected evidence to the browser.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087fff"/></marker></defs><rect width="1640" height="1235" fill="white"/><text x="42" y="55" font-size="34" font-family="Arial" font-weight="bold" fill="#101a44">One query(), from prompt to final result</text><rect x="670" y="85" width="650" height="40" rx="12" fill="#eee7ff"/><text x="995" y="113" text-anchor="middle" font-family="Arial" font-size="23" fill="#7330b9">Your computer: Node host + SDK child runtime</text><rect x="15" y="150" width="290" height="80" rx="16" fill="#087fff"/><text x="160" y="199" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Student</text><path d="M160 230 V1150" stroke="#abc6e2" stroke-dasharray="7 7"/><rect x="345" y="150" width="290" height="80" rx="16" fill="#087fff"/><text x="490" y="199" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Browser UI</text><path d="M490 230 V1150" stroke="#abc6e2" stroke-dasharray="7 7"/><rect x="675" y="150" width="290" height="80" rx="16" fill="#8838ff"/><text x="820" y="199" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Node host</text><path d="M820 230 V1150" stroke="#abc6e2" stroke-dasharray="7 7"/><rect x="1005" y="150" width="290" height="80" rx="16" fill="#8838ff"/><text x="1150" y="199" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Agent SDK runtime</text><path d="M1150 230 V1150" stroke="#abc6e2" stroke-dasharray="7 7"/><rect x="1335" y="150" width="290" height="80" rx="16" fill="#00a977"/><text x="1480" y="199" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Claude API</text><path d="M1480 230 V1150" stroke="#abc6e2" stroke-dasharray="7 7"/><path d="M160 300 H490" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="172" y="284" font-size="25" font-family="Arial" fill="#142d53">1. Enter a prompt; click Run query()</text><path d="M490 395 H820" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="502" y="379" font-size="25" font-family="Arial" fill="#142d53">2. POST /api/query with JSON input</text><path d="M820 490 h65 v25 h-65" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="905" y="506" font-size="25" font-family="Arial" fill="#142d53">3. Validate prompt and configuration</text><path d="M820 585 H1150" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="832" y="569" font-size="25" font-family="Arial" fill="#142d53">4. query({ prompt, options })</text><path d="M1150 680 H1480" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1162" y="664" font-size="25" font-family="Arial" fill="#142d53">5. Send model request with tools disabled</text><path d="M1480 775 H1150" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1162" y="759" font-size="25" font-family="Arial" fill="#142d53">6. Claude response and usage</text><path d="M1150 870 H820" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="832" y="854" font-size="25" font-family="Arial" fill="#142d53">7. Async SDK messages: assistant and result</text><path d="M820 965 H490" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="502" y="949" font-size="25" font-family="Arial" fill="#142d53">8. Stream selected JSON events</text><path d="M490 1060 H160" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="172" y="1044" font-size="25" font-family="Arial" fill="#142d53">9. Show answer, final status and evidence</text><text x="42" y="1200" font-family="Arial" font-size="24" fill="#276746">One SDK entry point · no tools · no Managed Agents provisioning · inspect the final result</text></svg>